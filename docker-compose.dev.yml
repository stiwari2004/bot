version: '3.8'

# CRITICAL: Always use project name to isolate from production
# Usage: docker-compose -f docker-compose.dev.yml -p bot-dev <command>
# This prevents affecting production containers
# Example: docker-compose -f docker-compose.dev.yml -p bot-dev up -d

services:
  # PostgreSQL with pgvector extension (dev instance)
  postgres:
    image: pgvector/pgvector:pg15
    container_name: bot-dev-postgres
    environment:
      POSTGRES_DB: troubleshooting_ai_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_password_change_me}
    # Postgres is only needed by backend/worker inside the Docker network.
    # Remove host port exposure to avoid conflicts with any host Postgres.
    # ports:
    #   - "5433:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      - ./backend/sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - app-dev-network

  redis:
    image: redis:7.2-alpine
    container_name: bot-dev-redis
    command: ["redis-server", "--appendonly", "yes"]
    # Redis is only needed by backend/worker inside the Docker network.
    # Remove host port exposure to avoid conflicts with any host Redis.
    # ports:
    #   - "6380:6379"
    volumes:
      - redis_dev_data:/data
    restart: unless-stopped
    networks:
      - app-dev-network

  # FastAPI Backend
  backend:
    container_name: bot-dev-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
      # Force Docker to use project directory for build cache, not home directory
      cache_from: []
    ports:
      - "8001:8000"  # Different port for dev
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    # Note: env_file is optional - all critical vars (DATABASE_URL, ENVIRONMENT, etc.) are set below
    # The .env file is only used for optional config like API keys (GEMINI_API_KEY, PERPLEXITY_API_KEY, etc.)
    # If you want complete isolation, create ./backend/.env.dev and use that instead
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-dev_password_change_me}@postgres:5432/troubleshooting_ai_dev
      - REDIS_URL=redis://redis:6379/0
      - WORKER_ORCHESTRATION_ENABLED=true
      - ENABLE_TICKETING_POLLER=true
      - ENVIRONMENT=development
      - DEBUG=true
      - FRONTEND_BASE_URL=https://dev.resolvify.tech
      - BACKEND_BASE_URL=https://dev.resolvify.tech
      - PYTHONPATH=/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./backend:/app  # Mount backend code live for development (allows uvicorn --reload to work)
      - ./discovery-agent:/app/discovery-agent  # Required for /api/v1/tenant-admin/discovery/agent.tar.gz and agent.zip
      - ./uploads-dev:/app/uploads  # Separate uploads directory for dev to avoid conflicts with production
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload  # Reload enabled for dev
    restart: unless-stopped
    networks:
      - app-dev-network

  worker:
    container_name: bot-dev-worker
    build:
      context: ./backend
      dockerfile: Dockerfile
      # Force Docker to use project directory for build cache, not home directory
      cache_from: []
    environment:
      - BACKEND_BASE_URL=http://backend:8000
      - WORKER_ID=worker-dev
      - REDIS_URL=redis://redis:6379/0
      - WORKER_ENVIRONMENT=development
      - PERPLEXITY_API_KEY=${PERPLEXITY_API_KEY:-}
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-dev_password_change_me}@postgres:5432/troubleshooting_ai_dev
    # Note: env_file is optional - all critical vars are set above
    # The .env file is only used for optional config like API keys
    env_file:
      - ./backend/.env
    depends_on:
      backend:
        condition: service_started  # Changed from service_healthy to avoid health check timeout issues
      redis:
        condition: service_started
    volumes:
      - ./backend:/app  # Mount backend code live for development (allows debug logs to be accessible)
    restart: unless-stopped
    networks:
      - app-dev-network
    command: python -m worker.main

  # Next.js Frontend
  frontend:
    container_name: bot-dev-frontend
    build:
      context: ./frontend-nextjs
      dockerfile: Dockerfile
      args:
        - NODE_ENV=development
      # Force Docker to use project directory for build cache, not home directory
      cache_from: []
    ports:
      - "3005:3000"  # Host 3005 to match nginx upstream for dev.resolvify.tech
    environment:
      - NODE_ENV=development
      # Required for next.config.js to detect Docker and use backend:8000 instead of localhost:8000
      - DOCKER=1
      - IN_DOCKER=1
      # Leave empty to use same-origin (nginx proxies /api to backend)
      - NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL:-}
    restart: unless-stopped
    depends_on:
      - backend
    volumes:
      - ./frontend-nextjs:/app
      - /app/node_modules
      - /app/.next
    networks:
      - app-dev-network
    command: npm run dev  # Dev mode with hot reload

volumes:
  postgres_dev_data:
  redis_dev_data:

networks:
  app-dev-network:
    # No explicit name: let Compose use default (project_app-dev-network) so labels stay correct
    driver: bridge

