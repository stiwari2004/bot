# Resolvify Discovery - unified scanner config
# Copy to config.yaml and set ingest URL + token. Optionally override with env:
#   DISCOVERY_INGEST_URL, DISCOVERY_TOKEN, DISCOVERY_RUN_ID

ingest:
  url: "https://your-app.example.com/api/v1/tenant-admin/discovery/ingest"
  token: "your-discovery-token-from-tenant-admin"
  run_id: null   # optional; omit to let backend create a run

# Report this host (Windows/Linux/Unix server) as one asset
agent:
  enabled: true

# Network devices: routers, switches (SSH and/or SNMP)
network:
  enabled: false
  snmp_community: "public"   # default if not per-device
  prefer_ssh: true
  devices:
    - host: "192.168.1.1"
      device_type: "cisco_ios"
      username: "admin"
      password: "secret"
      port: 22
    # - host: "192.168.1.2"
    #   device_type: "juniper_junos"
    #   username: "admin"
    #   password: "secret"
    # SNMP-only (no SSH):
    # - host: "192.168.1.3"
    #   snmp_only: true
    #   snmp_community: "public"

# Storage / SAN / NAS
storage:
  enabled: false
  targets:
    # Synology NAS
    - type: synology
      host: "192.168.1.10"
      username: "admin"
      password: "secret"
      port: 5001
      use_https: true
    # Generic REST: URL returns JSON array (or set items_path to array path)
    # - type: generic_rest
    #   url: "https://storage-api.example.com/api/arrays"
    #   headers: { "Authorization": "Bearer YOUR_API_KEY" }
    #   items_path: "data"       # optional: path to list, e.g. "data.hosts"
    #   name_key: "name"
    #   id_key: "id"
    #   ip_key: "management_ip"

# Remote servers: discover Linux/Windows servers, databases, etc. via SSH/WinRM from jump server
remote_servers:
  enabled: false
  timeout: 30   # Connection timeout in seconds
  jump_server:
    # Optional: if you're running discovery FROM the jump server, omit this section
    # If running from another machine, configure jump server here
    host: "jump.example.com"
    port: 22
    username: "admin"
    password: "secret"   # or use_keys: true with key_file
    # use_keys: false
    # key_file: "/path/to/ssh/key"
  servers:
    # Linux servers (via SSH)
    - host: "192.168.1.10"
      os_type: "linux"
      username: "ubuntu"
      password: "secret"
      port: 22
      # use_keys: false
      # key_file: "/path/to/key"
    - host: "192.168.1.11"
      os_type: "linux"
      username: "root"
      use_keys: true
      key_file: "/home/user/.ssh/id_rsa"
    # Windows servers (via WinRM)
    - host: "192.168.1.20"
      os_type: "windows"
      username: "Administrator"
      password: "secret"
      port: 5985   # WinRM HTTP port (5986 for HTTPS)
      use_https: false
    # Database servers
    - host: "192.168.1.30"
      db_type: "postgresql"
      username: "postgres"
      password: "secret"
      db_port: 5432
      database: "mydb"
    - host: "192.168.1.31"
      db_type: "mysql"
      username: "root"
      password: "secret"
      db_port: 3306
    # Auto-detect OS (tries SSH first, then WinRM if SSH fails)
    - host: "192.168.1.40"
      username: "admin"
      password: "secret"
