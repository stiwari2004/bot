user_template = '''Generate a troubleshooting runbook YAML for this issue.

ISSUE: {issue_description}
SERVICE: {service}
ENV: {env}
RISK: {risk}
OS TYPE: {os_type}

CONTEXT (similar runbooks for reference):
{context}

STEP 1 - THINK:
1. What metric is mentioned? (CPU/memory/disk/network)
2. What OS? (Windows/Linux - check context, issue description, or env)
3. What's the problem? (high utilization, full, slow, error)
4. What commands should I use? (Windows: Get-Counter/Get-Process, Linux: top/ps/free/df)

STEP 2 - PLAN (MANDATORY STRUCTURE):
- Precheck 1: Check the actual metric (e.g., CPU usage for CPU issues) - identifies true/false positive
- Precheck 2: Validate connectivity or system state
- Precheck 3: Additional validation
- Step 1-2: DIAGNOSE (identify root cause - max 2 diagnostic steps)
- Step 3-5: REMEDIATE (MANDATORY - fix the issue: kill processes, restart services, clear caches, free space, etc.)
- Step 6: VERIFY (confirm fix worked)
- Postcheck: Verify same metric is now normal → Close ticket if resolved, escalate if not

CRITICAL: At least 4 of your 5-6 steps MUST be remediation actions. With 5-6 total steps, you can have at most 1-2 diagnostic steps. Diagnostic-only runbooks will be REJECTED.
EACH STEP MUST INCLUDE:
- purpose: diagnose/remediate/verify
- requires_metric: which metric it uses (cpu, memory_percent, disk_free, network_latency, etc.)
- captures_variable: optional variable name to store data for later steps
- depends_on: optional list of variables this step needs; MUST refer to variables captured earlier
- skip_in_auto_mode + severity as usual

STEP 3 - GENERATE YAML:
Follow this structure exactly:

runbook_id: rb-server-[keyword]
version: 1.0.0
title: Fix [issue summary]
service: {service}
env: {env}
risk: {risk}
description: [Single-line description of issue and impact]

inputs:
- name: server_name
  type: string
  required: true
  description: Target server hostname or IP address

prechecks:
- description: [Check the actual metric from issue]
  command: [OS-specific command to check metric]
  expected_output: [What to expect]
- description: [Validate connectivity/system state]
  command: [ping or system check]
  expected_output: [Expected result]
- description: [Additional validation]
  command: [Relevant check]
  expected_output: [Expected result]

steps:
🚨 MANDATORY: At least 4 of 5-6 steps MUST be REMEDIATION actions. With 5-6 total steps, you can have at most 1-2 diagnostic steps. Purely diagnostic runbooks are INVALID. 🚨

EXAMPLE STRUCTURE (for CPU high issue):
- name: Identify top CPU-consuming processes
  type: command
  command: Get-Process | Sort-Object CPU -Descending | Select-Object -First 10
  expected_output: List of processes with CPU usage
  skip_in_auto_mode: false
  severity: safe
  purpose: diagnose
  requires_metric: cpu

- name: Capture top CPU PID
  type: command
  command: Get-Process | Sort-Object CPU -Descending | Select-Object -First 1
  expected_output: Top CPU process
  skip_in_auto_mode: false
  severity: safe
  purpose: diagnose
  captures_variable: top_cpu_pid

- name: REMEDIATE - Kill high CPU process
  type: command
  command: Stop-Process -Id {{top_cpu_pid}} -Force
  expected_output: Process terminated
  skip_in_auto_mode: false
  severity: moderate
  purpose: remediate
  depends_on:
    - top_cpu_pid
  requires_metric: cpu

- name: REMEDIATE - Restart overloaded service
  type: command
  command: Restart-Service -Name w3svc -Force
  expected_output: Service restarted successfully
  skip_in_auto_mode: false
  severity: moderate
  purpose: remediate

- name: REMEDIATE - Clear system logs if needed
  type: command
  command: Clear-EventLog -LogName System -Confirm:$false
  expected_output: Event log cleared
  skip_in_auto_mode: false
  severity: moderate
  purpose: remediate

- name: Verify CPU usage decreased
  type: command
  command: Get-Counter -Counter '\Processor(_Total)\% Processor Time' -SampleInterval 1 -MaxSamples 1
  expected_output: CPU usage below threshold
  skip_in_auto_mode: false
  severity: safe
  purpose: verify
  requires_metric: cpu

REMEDIATION COMMANDS (Windows):
- Stop-Process -Id <pid> -Force (kill process)
- Restart-Service <name> (restart service)
- Stop-Service <name>; Start-Service <name> (restart service)
- Clear-EventLog -LogName <name> (clear logs)
- Remove-Item -Path <path> -Recurse -Force (delete files/folders)

REMEDIATION COMMANDS (Linux):
- kill -9 <pid> (kill process)
- systemctl restart <service> (restart service)
- systemctl stop <service>; systemctl start <service> (restart service)
- rm -rf <path> (delete files/folders)
- truncate -s 0 <logfile> (clear log file)

❌ INVALID: Only diagnostic commands (Get-Process, Get-Counter, top, ps, etc.) without remediation
✅ VALID: Diagnostic → Remediation → Verification → Ticket closure/escalation

