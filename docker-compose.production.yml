services:
  # PostgreSQL with pgvector extension
  postgres:
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_DB: troubleshooting_ai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CHANGE_ME_STRONG_PASSWORD}
    # Postgres is only needed by backend/worker inside the Docker network.
    # Remove host port exposure to avoid conflicts with any host Postgres.
    # If you need host access, change to a non-conflicting port like "5433:5432".
    # ports:
    #   - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - app-network

  redis:
    image: redis:7.2-alpine
    command: ["redis-server", "--appendonly", "yes"]
    # Redis is only needed by backend/worker inside the Docker network.
    # Remove host port exposure to avoid conflicts with any host Redis.
    # If you need host access, change to a non-conflicting port like "6380:6379".
    # ports:
    #   - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - app-network

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # Backend port - change if 8000 is in use by other apps
    ports:
      - "8000:8000"  # Change to "8005:8000" if port 8000 is in use
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-CHANGE_ME_STRONG_PASSWORD}@postgres:5432/troubleshooting_ai
      - REDIS_URL=redis://redis:6379/0
      - WORKER_ORCHESTRATION_ENABLED=true
      - ENABLE_TICKETING_POLLER=true
      # Force IPv4 for external API calls (Gemini API fails on IPv6)
      - PYTHONUNBUFFERED=1
    # Force IPv4 only to avoid IPv6 connection issues with Gemini API
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
    # Explicit DNS servers (use IPv4 DNS)
    dns:
      - 8.8.8.8
      - 1.1.1.1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2
    restart: unless-stopped
    networks:
      - app-network

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - BACKEND_BASE_URL=http://backend:8000
      - WORKER_ID=worker-production
      - REDIS_URL=redis://redis:6379/0
      - WORKER_ENVIRONMENT=production
      - PERPLEXITY_API_KEY=${PERPLEXITY_API_KEY:-}
    env_file:
      - ./backend/.env
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network
    command: python -m worker.main

  # Next.js Frontend
  frontend:
    build:
      context: ./frontend-nextjs
      dockerfile: Dockerfile
      args:
        - NODE_ENV=production
    # Frontend port - change if 3000 is in use by other apps
    ports:
      - "3004:3000"  # Host 3004 to match nginx upstream; change if needed
    environment:
      - NODE_ENV=production
      # Leave empty to use same-origin (nginx proxies /api to backend)
      # Or set to https://demo.resolvify.tech if you want explicit domain
      - NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL:-}
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - app-network
    command: npm start

volumes:
  postgres_data:
  redis_data:

networks:
  app-network:
    driver: bridge

