name: Run Tests

on:
  pull_request:
    branches:
      - main
      - dev
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          # Install CPU-only PyTorch first to avoid CUDA dependencies (saves ~3GB)
          pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
          # Install sentence-transformers with CPU-only PyTorch
          pip install sentence-transformers --no-deps
          pip install transformers tokenizers safetensors huggingface-hub scikit-learn scipy numpy
          # Install remaining dependencies
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov
          # Clean up pip cache to free space
          pip cache purge || true

      - name: Run tests
        working-directory: ./backend
        run: |
          pytest tests/ -v --cov=app --cov-report=xml --tb=short || true
        continue-on-error: true

      - name: Clean up after tests
        if: always()
        run: |
          pip cache purge || true
          df -h

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          file: ./backend/coverage.xml
          flags: backend
        continue-on-error: true

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: ./frontend-nextjs
        run: npm ci

      - name: Run type check
        working-directory: ./frontend-nextjs
        run: npm run type-check || true
        continue-on-error: true

      - name: Run lint
        working-directory: ./frontend-nextjs
        run: npm run lint || true
        continue-on-error: true

  runbook-validation:
    name: Runbook Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          # Install CPU-only PyTorch first to avoid CUDA dependencies (saves ~3GB)
          pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
          # Install sentence-transformers with CPU-only PyTorch
          pip install sentence-transformers --no-deps
          pip install transformers tokenizers safetensors huggingface-hub scikit-learn scipy numpy
          # Install remaining dependencies
          pip install -r requirements.txt
          pip install pyyaml
          # Clean up pip cache to free space
          pip cache purge || true

      - name: Validate runbook YAML files
        working-directory: ./backend
        run: |
          python -c "
          import yaml
          import os
          import sys
          
          errors = []
          for root, dirs, files in os.walk('.'):
              for file in files:
                  if file.endswith('.yaml') or file.endswith('.yml'):
                      path = os.path.join(root, file)
                      try:
                          with open(path, 'r') as f:
                              yaml.safe_load(f)
                      except yaml.YAMLError as e:
                          errors.append(f'{path}: {e}')
          
          if errors:
              print('YAML Validation Errors:')
              for error in errors:
                  print(error)
              sys.exit(1)
          else:
              print('All YAML files are valid')
          " || true
        continue-on-error: true

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'
        continue-on-error: true

