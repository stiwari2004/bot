name: Deploy to Production

on:
  # Auto-deploy when dev deployment succeeds
  workflow_run:
    workflows: ["Deploy to Dev Environment"]
    types:
      - completed
    branches:
      - dev
  # Manual trigger
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip tests (use with caution)'
        required: false
        default: 'false'
  # Direct push to main (for emergency deployments)
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      (github.event_name != 'workflow_run' && github.event.inputs.skip_tests != 'true')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref }}
          sha: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || '' }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          # Install CPU-only PyTorch first to avoid CUDA dependencies (saves ~3GB)
          pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
          # Create a temporary requirements file excluding sentence-transformers
          grep -v "sentence-transformers" requirements.txt > requirements-ci.txt || cp requirements.txt requirements-ci.txt
          pip install -r requirements-ci.txt
          # Install sentence-transformers with --no-deps and its direct dependencies
          pip install transformers tokenizers safetensors huggingface-hub scikit-learn scipy numpy
          pip install sentence-transformers --no-deps
          pip install pytest pytest-asyncio
          # Clean up pip cache and temp file to free space
          rm -f requirements-ci.txt
          pip cache purge || true

      - name: Run unit tests
        working-directory: ./backend
        run: |
          pytest tests/ -v --tb=short || true
        continue-on-error: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend dependencies
        working-directory: ./frontend-nextjs
        run: npm ci

      - name: Run frontend type check
        working-directory: ./frontend-nextjs
        run: npm run type-check || true
        continue-on-error: true

      - name: Security scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
        continue-on-error: true

  build:
    name: Build Production Images
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref }}
          sha: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || '' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=pr
            type=sha,prefix=pr-

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend:latest,${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend:prod
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend:latest
          cache-to: type=inline

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend-nextjs
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend:latest,${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend:prod
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend:latest
          cache-to: type=inline
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=

  merge-to-main:
    name: Merge Dev to Main
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_branch }}
          sha: ${{ github.event.workflow_run.head_sha }}
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      
      - name: Merge dev to main
        run: |
          git checkout main
          git pull origin main
          # Check if merge is needed (if main is already up to date, skip)
          if git merge-base --is-ancestor origin/main origin/dev; then
            echo "Main is already up to date with dev, skipping merge"
          else
            git merge origin/dev --no-edit -m "Auto-merge from dev after successful deployment [skip ci]"
            git push origin main
          fi

  deploy-production:
    name: Deploy to Production
    needs: [build, merge-to-main]
    if: |
      (github.event_name == 'workflow_run' && needs.merge-to-main.result == 'success') ||
      (github.event_name == 'workflow_dispatch') ||
      (github.event_name == 'push')
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://resolvify.tech
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Production Server
        # Removed if condition - secrets cannot be used in step-level if conditions
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.PROD_SERVER_HOST }}
          username: ${{ secrets.PROD_SERVER_USER }}
          key: ${{ secrets.PROD_SERVER_SSH_KEY }}
          port: 22
          timeout: 30s
          command_timeout: 10m
          script: |
            cd /opt/opsbot/bot
            git pull origin main
            docker-compose -f docker-compose.production.yml pull
            docker-compose -f docker-compose.production.yml up -d --build
            docker-compose -f docker-compose.production.yml exec -T postgres psql -U postgres -d troubleshooting_ai -f /docker-entrypoint-initdb.d/add_runbook_environment.sql || true
            docker-compose -f docker-compose.production.yml exec -T postgres psql -U postgres -d troubleshooting_ai -f /docker-entrypoint-initdb.d/add_deployment_approvals_table.sql || true

