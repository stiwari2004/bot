# resolvify reverse proxy (Docker) - HTTP only
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

upstream resolvify_frontend {
  server frontend:3000;
}

upstream resolvify_backend {
  server backend:8000;
}

server {
  listen 80;

  # We still keep server_name for clarity (not mandatory)
  server_name
    dev.resolvify.tech
    demo.resolvify.tech
    admin.resolvify.tech
    resolvify.tech
    www.resolvify.tech;

  client_max_body_size 50m;

  # API -> backend
  location /api/ {
    proxy_pass http://resolvify_backend;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    # Outer nginx is doing TLS, so force https here
    proxy_set_header X-Forwarded-Proto https;

    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
  }

  # Health
  location = /health {
    proxy_pass http://resolvify_backend/health;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
  }

  # resolvify.tech/app (tenant app under path prefix) – strip /app and send to frontend as /
  location /app {
    rewrite ^/app/?(.*)$ /$1 break;
    proxy_pass http://resolvify_frontend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Prefix /app;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
  }

  # Next.js static assets (resolvify.tech/_next/*) – pass through to frontend
  location /_next/ {
    proxy_pass http://resolvify_frontend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_connect_timeout 60s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
  }

  # Frontend
  location / {
    proxy_pass http://resolvify_frontend;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }
}
