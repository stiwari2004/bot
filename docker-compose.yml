version: '3.8'

services:
  # PostgreSQL with pgvector extension
  postgres:
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_DB: troubleshooting_ai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      # SECURITY: These values are for LOCAL DEVELOPMENT ONLY
      # For production, use environment variables or secrets management
      # 
      # IMPORTANT: Set these in a .env file in the backend/ directory:
      #   SECRET_KEY=<your-generated-key>
      #   CREDENTIAL_ENCRYPTION_KEY=<your-generated-key>
      # 
      # Generate secure values:
      #   SECRET_KEY: python -c 'import secrets; print(secrets.token_urlsafe(32))'
      #   CREDENTIAL_ENCRYPTION_KEY: python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())'
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/troubleshooting_ai
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-temp-allow-in-development-only-change-me}
      - CREDENTIAL_ENCRYPTION_KEY=${CREDENTIAL_ENCRYPTION_KEY:-mkEobHr9CF2zTF8xJHVGVuySweN7KFvbus3rTdiZy5Y=}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - LLM_PROVIDER=llamacpp
      - LLAMACPP_BASE_URL=http://host.docker.internal:11434
      - REDIS_URL=redis://redis:6379/0
      - WORKER_ORCHESTRATION_ENABLED=true
      - ENABLE_TICKETING_POLLER=true
      - PERPLEXITY_API_KEY=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
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./backend:/app
      - ./uploads:/app/uploads
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - BACKEND_BASE_URL=http://backend:8000
      - WORKER_ID=worker-local
      - REDIS_URL=redis://redis:6379/0
      - WORKER_ENVIRONMENT=dev
      - PERPLEXITY_API_KEY=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
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_started
    volumes:
      - ./backend:/app
    command: python -m worker.main

  # Next.js Frontend
  frontend:
    build:
      context: ./frontend-nextjs
      dockerfile: Dockerfile
      args:
        - NODE_ENV=development
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
    volumes:
      - ./frontend-nextjs:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev
    depends_on:
      - backend



volumes:
  postgres_data:
  redis_data:

