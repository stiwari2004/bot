# Demo instance - demo.resolvify.tech
# Full hardening: TRACE/TRACK, server_tokens, CSP, COEP/COOP (Spectre), X-Powered-By

server {
  server_name demo.resolvify.tech;
  server_tokens off;

  # Block TRACE/TRACK (OWASP ZAP Proxy Disclosure)
  if ($request_method = TRACE) { return 405; }
  if ($request_method = TRACK) { return 405; }

  # CSP (ZAP 10038) - app-only host
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none';" always;

  # Spectre / site isolation (ZAP 90004)
  add_header Cross-Origin-Embedder-Policy "require-corp" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;

  listen 443 ssl;
  ssl_certificate /etc/letsencrypt/live/demo.resolvify.tech/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/demo.resolvify.tech/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  location / {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_hide_header X-Powered-By;

    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
  }
}

server {
  listen 80;
  server_name demo.resolvify.tech;
  return 301 https://$host$request_uri;
}
