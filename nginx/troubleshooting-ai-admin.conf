# Nginx configuration for admin.yourdomain.com
# Redirects to demo.yourdomain.com/super-admin
# Place in: /etc/nginx/sites-available/troubleshooting-ai-admin

# Redirect HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name admin.yourdomain.com;

    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Redirect all other HTTP to HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS server - redirect to super-admin
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.yourdomain.com;

    # SSL certificates (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/admin.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.yourdomain.com/privkey.pem;
    
    # SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Redirect to super-admin on demo instance
    location / {
        return 301 https://demo.yourdomain.com/super-admin$request_uri;
    }
}

