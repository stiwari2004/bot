# Dev environment - dev.resolvify.tech
server {
    server_name dev.resolvify.tech;
    server_tokens off;

    # Block TRACE/TRACK (OWASP ZAP Proxy Disclosure)
    if ($request_method = TRACE) { return 405; }
    if ($request_method = TRACK) { return 405; }

    # CSP (ZAP 10038)
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none';" always;

    # Spectre / site isolation (ZAP 90004) - use credentialless to avoid breaking Next.js/API (require-corp can cause 502-like issues)
    add_header Cross-Origin-Embedder-Policy "credentialless" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # Proxy API requests to backend (incl. super-admin dashboard WebSocket)
    location /api {
        proxy_pass http://localhost:8001;
        proxy_set_header Host $host;
        proxy_hide_header X-Powered-By;
        proxy_http_version 1.1;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # Increase timeouts for long-running dev operations (e.g., runbook generation, WebSocket)
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        send_timeout 300s;
    }

    # Proxy health check to backend
    location /health {
        proxy_pass http://localhost:8001;
        proxy_set_header Host $host;
        proxy_hide_header X-Powered-By;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy everything else to frontend
    location / {
        proxy_pass http://localhost:3005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_hide_header X-Powered-By;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/resolvify.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/resolvify.tech/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# HTTP to HTTPS redirect for dev
server {
    if ($host = dev.resolvify.tech) {
        return 301 https://$host$request_uri;
    }
    listen 80;
    server_name dev.resolvify.tech;
    return 404;
}

