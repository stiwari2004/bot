# resolvify.tech: marketing site at root + app at /app when ?customer_slug=*
# Use this to replace or merge with your current resolvify.tech server block.
# Ensure the Next.js app (tenant login) runs with NEXT_PUBLIC_BASE_PATH=/app and is listening on APP_PORT (e.g. 3000).

server {
  server_name resolvify.tech www.resolvify.tech;

  listen 443 ssl;
  ssl_certificate /etc/letsencrypt/live/resolvify.tech/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/resolvify.tech/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  root /opt/opsbot/bot/resolvify-website/dist;
  index index.html;

  # API -> backend (unchanged)
  location /api/ {
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Root with customer_slug -> redirect to /app so the app is served
  location = / {
    if ($arg_customer_slug != "") {
      return 302 /app$is_args$args;
    }
    try_files /index.html =404;
  }

  # App (tenant login) – same gateway as demo.resolvify.tech (proxy on 8080)
  location /app {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /app;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_connect_timeout 60s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
  }

  # Next.js static assets (JS, CSS, fonts) – app emits /_next/* so must proxy to gateway
  # Without this, /_next/* hits marketing and returns HTML → "Unexpected token '<'"
  location /_next/ {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 60s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
  }

  # Everything else -> marketing static site
  location / {
    try_files $uri $uri/ /index.html;
  }
}

server {
  listen 80;
  server_name resolvify.tech www.resolvify.tech;
  return 301 https://$host$request_uri;
}
