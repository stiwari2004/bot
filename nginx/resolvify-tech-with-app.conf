# resolvify.tech: marketing site at root + app at /app when ?customer_slug=*
#
# OPTION A (recommended): Use frontend-app container (basePath /app) on port 3005.
#   - Run: docker compose -f docker-compose.production.yml --profile resolvify-app up -d
#   - Use the "OPTION A" location /app block below (proxy to 3005). No location /_next/ needed.
#
# OPTION B: Use shared gateway 8080. Requires location /_next/ on host (see below).
#   - If you get "Unexpected token '<'" on .js, switch to OPTION A.

server {
  server_name resolvify.tech www.resolvify.tech;

  listen 443 ssl;
  ssl_certificate /etc/letsencrypt/live/resolvify.tech/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/resolvify.tech/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  root /opt/opsbot/bot/resolvify-website/dist;
  index index.html;

  location /api/ {
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = / {
    if ($arg_customer_slug != "") {
      return 302 /app$is_args$args;
    }
    try_files /index.html =404;
  }

  # OPTION A: App with basePath /app (frontend-app on 3005) – no /_next/ block needed
  location /app {
    proxy_pass http://127.0.0.1:3005;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_connect_timeout 60s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
  }

  # OPTION B (only if not using OPTION A): Gateway 8080 + must have /_next/ below
  # location /app {
  #   proxy_pass http://127.0.0.1:8080;
  #   proxy_http_version 1.1;
  #   proxy_set_header Host $host;
  #   proxy_set_header X-Real-IP $remote_addr;
  #   proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  #   proxy_set_header X-Forwarded-Proto $scheme;
  #   proxy_set_header X-Forwarded-Prefix /app;
  #   proxy_set_header Upgrade $http_upgrade;
  #   proxy_set_header Connection "upgrade";
  #   proxy_connect_timeout 60s;
  #   proxy_read_timeout 60s;
  #   proxy_send_timeout 60s;
  # }

  # Only needed for OPTION B (gateway 8080). Omit when using OPTION A (3005).
  # location /_next/ {
  #   proxy_pass http://127.0.0.1:8080;
  #   proxy_http_version 1.1;
  #   proxy_set_header Host $host;
  #   proxy_set_header X-Real-IP $remote_addr;
  #   proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  #   proxy_set_header X-Forwarded-Proto $scheme;
  #   proxy_connect_timeout 60s;
  #   proxy_read_timeout 60s;
  #   proxy_send_timeout 60s;
  # }

  location / {
    try_files $uri $uri/ /index.html;
  }
}

server {
  listen 80;
  server_name resolvify.tech www.resolvify.tech;
  return 301 https://$host$request_uri;
}
