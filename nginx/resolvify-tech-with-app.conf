# resolvify.tech: marketing at root; ?customer_slug=* → app on same host (URL stays resolvify.tech?customer_slug=*)
#
# When customer_slug is present, proxy / to gateway 8080 so the app loads and URL stays resolvify.tech?customer_slug=konverge.
# Also proxy /_next/ to 8080 so app assets load.

server {
  server_name resolvify.tech www.resolvify.tech;

  listen 443 ssl;
  ssl_certificate /etc/letsencrypt/live/resolvify.tech/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/resolvify.tech/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  root /opt/opsbot/bot/resolvify-website/dist;
  index index.html;

  location /api/ {
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # ?customer_slug=* → proxy / to app (gateway 8080); URL stays https://resolvify.tech?customer_slug=konverge
  # (nginx does not allow proxy_* inside "if", so use internal named location)
  location = / {
    if ($arg_customer_slug != "") {
      rewrite ^ /@app last;
    }
    try_files /index.html =404;
  }
  location = /@app {
    internal;
    proxy_pass http://127.0.0.1:8080/?$args;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_connect_timeout 60s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
  }

  # App static assets (app emits /_next/*); must proxy so JS/CSS load on resolvify.tech
  location /_next/ {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 60s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
  }

  # /app path → same gateway (8080); gateway rewrites /app to / for frontend
  location /app {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /app;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_connect_timeout 60s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}

server {
  listen 80;
  server_name resolvify.tech www.resolvify.tech;
  return 301 https://$host$request_uri;
}
