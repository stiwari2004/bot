# Dev environment - dev.resolvify.tech
# Proxies directly to dev services running on localhost

server {
    server_name dev.resolvify.tech;
    server_tokens off;

    # Block TRACE/TRACK (OWASP ZAP Proxy Disclosure)
    if ($request_method = TRACE) { return 405; }
    if ($request_method = TRACK) { return 405; }

    # CSP (ZAP 10038) - applied to /, /robots.txt, /sitemap.xml, etc.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none';" always;

    # Spectre / site isolation (ZAP 90004) - use credentialless to avoid breaking Next.js/API (require-corp can cause 502-like issues)
    add_header Cross-Origin-Embedder-Policy "credentialless" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # WebSocket: do not send COEP/COOP on upgrade response (breaks WS connection)
    location /api/v1/super-admin/dashboard/ws {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
        add_header X-Content-Type-Options "nosniff";
    }

    # Proxy API requests to dev backend (port 8001)
    location /api {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header X-Powered-By;

        # since backend may stream / websockets
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Proxy health check to dev backend
    location /health {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header X-Powered-By;
    }

    # Proxy all other requests to dev frontend (port 3005)
    location / {
        proxy_pass http://127.0.0.1:3005;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Hide framework info (OWASP ZAP: X-Powered-By leak)
        proxy_hide_header X-Powered-By;

        # WebSocket support for Next.js
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/resolvify.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/resolvify.tech/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    server_name dev.resolvify.tech;
    return 301 https://$host$request_uri;
}

