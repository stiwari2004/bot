# Nginx configuration for backend.yourdomain.com (Optional - Direct API access)
# Place in: /etc/nginx/sites-available/troubleshooting-ai-backend
# IMPORTANT: Restrict access with IP whitelist or API keys

# Redirect HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name backend.yourdomain.com;

    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Redirect all other HTTP to HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name backend.yourdomain.com;

    # SSL certificates (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/backend.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/backend.yourdomain.com/privkey.pem;
    
    # SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # IP Whitelist (uncomment and add your IPs)
    # allow 1.2.3.4;  # Your office IP
    # allow 5.6.7.8;  # Your home IP
    # deny all;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req zone=api_limit burst=20 nodelay;

    # Proxy to Backend API
    location / {
        proxy_pass http://localhost:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # Health check (public)
    location /health {
        proxy_pass http://localhost:8000/health;
        access_log off;
    }
}

